name: bot
on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            gh_checker.session
          key: bot-state-never-matches
          restore-keys: bot-state

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          SMSCENTER_BOT_TOKEN: ${{ secrets.SMSCENTER_BOT_TOKEN }}
          SMSCENTER_ADMIN_ID: ${{ secrets.SMSCENTER_ADMIN_ID }}
          SMSCENTER_BOT_STATE: state.json
          SMSCENTER_TG_API_ID: ${{ secrets.TG_API_ID }}
          SMSCENTER_TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_B64: ${{ secrets.TG_SESSION_B64 }}
        run: |
          if [ ! -e gh_checker.session ] && [ -n "$TG_SESSION_B64" ]; then printf '%s' "$TG_SESSION_B64" | tr -d '\r\n ' | base64 -d > gh_checker.session; fi
          timeout --signal=INT --kill-after=60 330m python smscenter_price_bot.py || [ $? -eq 124 ]

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            gh_checker.session
          key: bot-state-${{ github.run_id }}

      - name: Restart
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId})
            const mins = (Date.now() - new Date(run.data.run_started_at)) / 60000
            if (mins < 10) { core.setFailed('bot exited after ' + mins.toFixed(1) + ' min, not restarting'); return }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot.yml',
              ref: 'master'
            })
